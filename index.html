<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urjuzah Hub - Sirah Nabawiyah Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0A192F; color: #F8FAFC; }
        .glass { background: rgba(10, 25, 47, 0.7); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(100, 255, 218, 0.1); }
        .neon-border { border: 1px solid rgba(100, 255, 218, 0.15); }
        .neon-border:hover { border-color: #64FFDA; box-shadow: 0 0 15px rgba(100, 255, 218, 0.15); }
        .text-neon { color: #64FFDA; }
        .bg-neon { background-color: #64FFDA; }
        .transition-custom { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <nav class="fixed top-0 w-full glass z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
            <div class="bg-neon/10 p-2 rounded-xl border border-neon/30">
                <i data-lucide="book-open" class="text-neon w-5 h-5"></i>
            </div>
            <span class="text-xl font-extrabold tracking-tighter">Urjuzah<span class="text-neon">Hub</span></span>
        </div>
        <div class="flex items-center gap-4">
            <a href="https://discord.gg/opencloud" target="_blank" class="text-xs font-semibold text-slate-300 hover:text-neon transition-custom flex items-center gap-1.5 bg-white/5 px-4 py-2 rounded-full">
                <i data-lucide="users" class="w-3.5 h-3.5"></i> Komunitas
            </a>
        </div>
    </nav>

    <!-- App Container -->
    <main id="app-container" class="pt-28 px-6 max-w-6xl mx-auto w-full flex-grow pb-12">
        <!-- Halaman akan di-render secara dinamis di sini -->
    </main>

    <!-- Footer -->
    <footer class="border-t border-white/5 py-8 text-center text-xs text-slate-500">
        <p>© 2025 Urjuzah Hub. Didesain secara premium oleh Senior UI/UX Designer.</p>
    </footer>

    <script>
        const battles = [
            { 
                id: 1, 
                name: "Perang Waddan (Abwa')", 
                year: "2 Hijriah", 
                desc: "Perang Waddan (atau Abwa') adalah pertempuran pertama yang dipimpin langsung oleh Rasulullah SAW setelah hijrah ke Madinah. Tujuan utamanya adalah untuk membuat perjanjian damai dengan kabilah Bani Dhamrah serta mengamankan rute perdagangan di sekitar wilayah Madinah.", 
                lesson: "Pentingnya diplomasi, menjaga keamanan wilayah pertahanan, dan membangun aliansi damai sejak dini.",
                strategy: "Nabi SAW memimpin langsung 70 orang sahabat Muhajirin untuk memotong jalur kafilah dagang Quraisy dan mengikat perjanjian damai dengan kabilah setempat."
            },
            { 
                id: 2, 
                name: "Perang Badar Al-Kubra", 
                year: "2 Hijriah", 
                desc: "Pertempuran besar pertama yang menentukan masa depan Islam. Pasukan muslim yang berjumlah hanya 313 orang berhasil mengalahkan pasukan kafir Quraisy yang berjumlah lebih dari 1000 orang dengan bantuan para malaikat yang dikirim oleh Allah SWT.", 
                lesson: "Kemenangan mutlak hanya datang dari pertolongan Allah SWT, bukan semata-mata karena jumlah pasukan atau senjata.",
                strategy: "Menguasai sumber mata air Badar terlebih dahulu sebelum musuh tiba, memaksa musuh bertempur dalam kondisi kehausan."
            },
            { 
                id: 3, 
                name: "Perang Uhud", 
                year: "3 Hijriah", 
                desc: "Ujian berat bagi kaum muslimin di bukit Uhud. Akibat sebagian pasukan pemanah mengabaikan perintah Rasulullah SAW karena tergoda harta rampasan perang (ghanimah), pasukan Khalid bin Walid (saat itu belum masuk Islam) berhasil memutarbalikkan keadaan.", 
                lesson: "Ketaatan mutlak kepada pemimpin dan fokus pada tujuan perjuangan, bukan pada urusan duniawi.",
                strategy: "Menempatkan 50 pasukan pemanah di atas bukit Ainain untuk melindungi lini belakang pasukan utama."
            }
        ];

        let currentPage = 'home';
        let activeBattleId = null;

        function navigateTo(page, id = null) {
            currentPage = page;
            activeBattleId = id;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function render() {
            const container = document.getElementById('app-container');
            if (currentPage === 'home') {
                container.innerHTML = `
                    <div class="fade-in">
                        <!-- Hero -->
                        <div class="text-center mb-16">
                            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4">
                                Sirah Nabawiyah <br class="hidden md:block"><span class="text-neon bg-clip-text">Urjuzah al-Mi'iyah</span>
                            </h1>
                            <p class="text-slate-400 max-w-2xl mx-auto text-sm md:text-base">
                                Jelajahi sejarah perang, strategi militer, dan hikmah berharga dari setiap pertempuran Rasulullah SAW melalui navigasi Single Page Application yang modern dan cepat.
                            </p>
                        </div>

                        <!-- Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${battles.map(b => `
                                <div onclick="navigateTo('detail', ${b.id})" class="neon-border glass p-6 rounded-3xl cursor-pointer transition-custom flex flex-col justify-between h-64">
                                    <div>
                                        <div class="flex justify-between items-center mb-4">
                                            <span class="text-xs font-bold text-neon uppercase tracking-widest">${b.year}</span>
                                            <i data-lucide="arrow-up-right" class="w-4 h-4 text-slate-500 group-hover:text-neon"></i>
                                        </div>
                                        <h3 class="text-xl font-bold mb-2">${b.name}</h3>
                                        <p class="text-slate-400 text-xs leading-relaxed line-clamp-3">${b.desc}</p>
                                    </div>
                                    <span class="text-neon text-xs font-semibold flex items-center gap-1">Pelajari Selengkapnya <i data-lucide="chevron-right" class="w-3 h-3"></i></span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentPage === 'detail') {
                const b = battles.find(x => x.id === activeBattleId);
                container.innerHTML = `
                    <div class="fade-in max-w-3xl mx-auto">
                        <!-- Back Button -->
                        <button onclick="navigateTo('home')" class="flex items-center gap-2 text-slate-400 hover:text-neon text-sm font-semibold mb-8 transition-custom">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Beranda
                        </button>

                        <!-- Header -->
                        <div class="border-b border-white/10 pb-6 mb-8">
                            <span class="text-xs font-bold text-neon uppercase tracking-widest">${b.year}</span>
                            <h1 class="text-3xl md:text-5xl font-extrabold mt-2">${b.name}</h1>
                        </div>

                        <!-- Content -->
                        <div class="space-y-8">
                            <div>
                                <h3 class="text-lg font-bold text-neon mb-2 flex items-center gap-2"><i data-lucide="book-open" class="w-5 h-5"></i> Ringkasan Peristiwa</h3>
                                <p class="text-slate-300 text-sm md:text-base leading-relaxed">${b.desc}</p>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="bg-white/5 p-6 rounded-3xl border border-white/5">
                                    <h4 class="text-sm font-bold text-neon mb-2 flex items-center gap-2"><i data-lucide="shield" class="w-4 h-4"></i> Strategi Militer</h4>
                                    <p class="text-slate-300 text-xs leading-relaxed">${b.strategy}</p>
                                </div>
                                <div class="bg-white/5 p-6 rounded-3xl border border-white/5">
                                    <h4 class="text-sm font-bold text-neon mb-2 flex items-center gap-2"><i data-lucide="award" class="w-4 h-4"></i> Pelajaran Berharga</h4>
                                    <p class="text-slate-300 text-xs leading-relaxed">${b.lesson}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        // Jalankan render pertama kali
        render();
    </script>
</body>
</html>
